vsr:
  request:
    max-body-size: 16KB
  version:
    header: ${VERSION_HEADER}
    supported: ${VERSION_SUPPORTED}
    default: ${VERSION_DEFAULT}
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES}
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
