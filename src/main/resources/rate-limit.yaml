rate-limit:
  api:
    capacity: ${RATE_LIMIT_API_CAPACITY}
    refill-rate: ${RATE_LIMIT_API_REFILL_RATE}
    refill-interval: ${RATE_LIMIT_API_REFILL_INTERVAL}
  login:
    capacity: ${RATE_LIMIT_LOGIN_CAPACITY}
    refill-rate: ${RATE_LIMIT_LOGIN_REFILL_RATE}
    refill-interval: ${RATE_LIMIT_LOGIN_REFILL_INTERVAL}
  register:
    capacity: ${RATE_LIMIT_REGISTER_CAPACITY}
    refill-rate: ${RATE_LIMIT_REGISTER_REFILL_RATE}
    refill-interval: ${RATE_LIMIT_REGISTER_REFILL_INTERVAL}
  refresh:
    capacity: ${RATE_LIMIT_REFRESH_CAPACITY}
    refill-rate: ${RATE_LIMIT_REFRESH_REFILL_RATE}
    refill-interval: ${RATE_LIMIT_REFRESH_REFILL_INTERVAL}
  account:
    capacity: ${RATE_LIMIT_ACCOUNT_CAPACITY}
    refill-rate: ${RATE_LIMIT_ACCOUNT_REFILL_RATE}
    refill-interval: ${RATE_LIMIT_ACCOUNT_REFILL_INTERVAL}
  password:
    capacity: ${RATE_LIMIT_PASSWORD_RESET_CAPACITY}
    refill-rate: ${RATE_LIMIT_PASSWORD_RESET_REFILL_RATE}
    refill-interval: ${RATE_LIMIT_PASSWORD_RESET_REFILL_INTERVAL}
  upload:
    capacity: ${RATE_LIMIT_UPLOAD_CAPACITY}
    refill-rate: ${RATE_LIMIT_UPLOAD_REFILL_RATE}
    refill-interval: ${RATE_LIMIT_UPLOAD_REFILL_INTERVAL}